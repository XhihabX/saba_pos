name: Tests & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanity-check:
    name: Environment & Sanity Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, gd
          coverage: none

      - name: Copy .env
        shell: bash
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        shell: bash
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Key
        shell: bash
        run: php artisan key:generate

      - name: Run Artisan About Check
        shell: bash
        run: php artisan about

      - name: Run Larastan Level 5 Static Analysis
        shell: bash
        run: vendor/bin/phpstan analyse --no-progress

  laravel-tests:
    name: MySQL 8.4 Test Suite
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sabapos_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_URL: ''

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: sabapos_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, pdo_sqlite, pdo_mysql, gd
          coverage: pcov

      - name: Copy .env
        shell: bash
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        shell: bash
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Key
        shell: bash
        run: php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build Assets
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Directory Permissions
        shell: bash
        run: chmod -R 775 storage bootstrap/cache

      - name: Run Migrations on MySQL
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --force

      - name: Execute Main Test Suite on MySQL 8.4
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php vendor/phpunit/phpunit/phpunit -c phpunit.mysql.xml --exclude-group backup --coverage-clover=coverage.clover 2>&1 | tee test_main.log

      - name: Enforce >= 60% Code Coverage on Core Domains
        shell: bash
        run: php scripts/check_coverage.php coverage.clover 60.0

      - name: Print Failure Log
        if: failure()
        shell: bash
        run: |
          echo "### ❌ PHPUnit Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_main.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Execute Backup Test Suite on MySQL 8.4
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php vendor/phpunit/phpunit/phpunit -c phpunit.mysql.xml --group backup

      - name: Seed CI Playwright Test Data
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan migrate --force
          php artisan db:seed --class=CiPlaywrightSeeder --force

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Start Laravel Web Server & Await Health Check
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan serve --port=8000 &
          echo "Waiting for http://127.0.0.1:8000/health..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"healthy"'; then
              echo "✅ Laravel server is up and healthy!"
              break
            fi
            sleep 1
          done

      - name: Execute Playwright E2E Offline Sales Test
        shell: bash
        env:
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: npx playwright test

      - name: Upload Playwright Report & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
