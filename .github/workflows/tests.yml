name: Tests & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanity-check:
    name: Environment & Sanity Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, gd
          coverage: none

      - name: Copy .env
        shell: bash
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        shell: bash
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Key
        shell: bash
        run: php artisan key:generate

      - name: Run Artisan About Check
        shell: bash
        run: php artisan about

  laravel-tests:
    name: MySQL 8.4 Test Suite
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sabapos_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_URL: ''

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: sabapos_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Copy .env
        shell: bash
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        shell: bash
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Key
        shell: bash
        run: php artisan key:generate

      - name: Directory Permissions
        shell: bash
        run: chmod -R 775 storage bootstrap/cache

      - name: Run Migrations on MySQL
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sabapos_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --force

      - name: Execute Main Test Suite on MySQL 8.4
        shell: bash
        run: set -o pipefail; php artisan test -c phpunit.mysql.xml --exclude-group backup 2>&1 | tee test_main.log

      - name: Execute Backup Test Suite on MySQL 8.4
        shell: bash
        run: set -o pipefail; php artisan test -c phpunit.mysql.xml --group backup 2>&1 | tee test_backup.log

      - name: Log Test Output to Step Summary on Failure
        if: failure()
        shell: bash
        run: |
          if [ -f test_main.log ]; then
            echo "### Main Test Failure Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 test_main.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f test_backup.log ]; then
            echo "### Backup Test Failure Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 test_backup.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
